name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: avf }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/avf
      JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcd
      ENCRYPTION_KEY: ci-encryption-key-fedcba9876543210-xyz-1234
      FRONTEND_URL: http://localhost:3000
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # depoda kilit dosyası yok: önbellek yalnız kilit dosyasıyla çalışır
      - run: npm install
      - run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || exit 1; done
      - run: npm test
      - run: python3 scripts/stamp.py && git diff --exit-code site site-uzman
      - name: Sunucu açılış denetimi
        run: |
          node src/server.js & 
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done; exit 1
