<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
<title id="t">TDEE'nin bileşenleri</title>
<desc id="d">Bazal metabolizma yaklaşık yüzde 60 ile 70, günlük hareket yüzde 15 ile 30, egzersiz yüzde 5 ile 10, sindirim yaklaşık yüzde 10.</desc>
<style>text{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.h{font-size:24px;font-weight:800;fill:#09090b}.s{font-size:14px;fill:#52525b}.b{font-size:15px;font-weight:800;fill:#fff}.l{font-size:16px;font-weight:800;fill:#09090b}.e{font-size:13px;fill:#52525b}</style>
<rect width="800" height="330" rx="22" fill="#ffffff"/>
<text x="40" y="54" class="h">Günde harcadığın enerji nereye gidiyor?</text>
<text x="40" y="80" class="s">Yaklaşık paylar; kişiden kişiye değişir. En oynak kalem günlük hareket (NEAT).</text>
<g>
<rect x="40" y="112" width="720" height="64" rx="16" fill="#f4f4f5"/>
<path d="M56 112h392v64H56a16 16 0 0 1-16-16v-32a16 16 0 0 1 16-16z" fill="#27272a"/>
<rect x="448" y="112" width="158" height="64" fill="#ea580c"/>
<rect x="606" y="112" width="58" height="64" fill="#16a34a"/>
<path d="M664 112h80a16 16 0 0 1 16 16v32a16 16 0 0 1-16 16h-80z" fill="#2563eb"/>
<text x="244" y="150" text-anchor="middle" class="b">BMR · %60–70</text>
<text x="527" y="150" text-anchor="middle" class="b">NEAT · %15–30</text>
<text x="635" y="150" text-anchor="middle" class="b">EAT</text>
<text x="712" y="150" text-anchor="middle" class="b">TEF</text>
</g>
<g transform="translate(40 214)">
<rect width="14" height="14" rx="4" fill="#27272a"/><text x="22" y="12" class="l">Bazal metabolizma</text><text x="22" y="32" class="e">Yatarken bile çalışan organlar</text>
<rect x="200" width="14" height="14" rx="4" fill="#ea580c"/><text x="222" y="12" class="l">Günlük hareket</text><text x="222" y="32" class="e">Yürüme, ayakta durma, kıpırdanma</text>
<rect x="420" width="14" height="14" rx="4" fill="#16a34a"/><text x="442" y="12" class="l">Egzersiz · %5–10</text><text x="442" y="32" class="e">Antrenman</text>
<rect x="580" width="14" height="14" rx="4" fill="#2563eb"/><text x="602" y="12" class="l">Sindirim · ~%10</text><text x="602" y="32" class="e">Proteinde en yüksek</text>
</g>
<text x="40" y="300" class="s">İpucu: Günlük adım sayını artırmak, antrenmandan bile fazla kalori yaktırabilir. 🚶</text>
</svg>
