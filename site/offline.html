<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111113">
<title>Bağlantı yok — AlpveFit</title>
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#111113;--mut:#5b5b62;--line:#e6e6e2}
@media (prefers-color-scheme:dark){:root{--bg:#0B0B0D;--card:#141417;--ink:#f4f4f5;--mut:#a1a1aa;--line:#26262b}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.c{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px;text-align:center}
img{width:64px;height:64px;border-radius:16px}
h1{font-size:21px;margin:16px 0 8px;letter-spacing:-.01em}p{margin:0 0 6px;color:var(--mut);line-height:1.55;font-size:15px}
.en{font-size:13px;margin-top:2px}
a{display:inline-block;margin-top:20px;padding:12px 20px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="c">
<img src="/assets/icons/icon-192.png" alt="AlpveFit">
<h1>İnternet bağlantısı yok</h1>
<p>Bağlantınız geri geldiğinde kaldığınız yerden devam edebilirsiniz.</p>
<p class="en" lang="en">You're offline. Reconnect to continue where you left off.</p>
<a href="/">Tekrar dene · Try again</a>
</main>
</body>
</html>
